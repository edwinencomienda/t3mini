# Source of truth for the Xcode project. Edit this file, then run `xcodegen generate`.
# T3Mini.xcodeproj is generated and gitignored: never edit it by hand.
name: T3Mini
options:
  deploymentTarget:
    iOS: '18.0'
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic

targets:
  T3Mini:
    type: application
    platform: iOS
    sources:
      - T3Mini
      - Shared
      - LiveActivity
      # Mermaid for diagrams (show_diagram), from the web app's own install (`bun install` at
      # the repo root first); bundled, so the phone draws diagrams with no network.
      - path: ../node_modules/mermaid/dist/mermaid.min.js
        buildPhase: resources
      # The working characters, the same GIFs as the web app (public/mascots).
      - path: ../public/mascots
        type: folder
        buildPhase: resources
    dependencies:
      - target: T3MiniNotify
        embed: true
      - target: T3MiniWidgets
        embed: true
    # Signing team and bundle id come from Config/Signing.xcconfig (gitignored, see README).
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    # Push notifications (APNs): development for builds from Xcode or scripts/run-on-device.sh;
    # an App Store or TestFlight export switches it to production.
    entitlements:
      path: T3Mini/T3Mini.entitlements
      properties:
        aps-environment: development
        # The push key is shared with the notification extension (and only the push key).
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(T3MINI_BUNDLE_ID).shared
    info:
      path: T3Mini/Info.plist
      properties:
        T3MiniSharedKeychain: $(AppIdentifierPrefix)$(T3MINI_BUNDLE_ID).shared
        # A thread at work on the lock screen and in the Dynamic Island (T3MiniWidgets).
        NSSupportsLiveActivities: true
        # t3mini://thread/<id>: a tapped Live Activity opens its thread.
        CFBundleURLTypes:
          - CFBundleURLName: t3mini
            CFBundleURLSchemes: [t3mini]
        # Only local addresses (a paired Mac on the local network) may use plain HTTP.
        # Tailscale addresses are HTTPS with a real certificate, so nothing else is relaxed.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(T3MINI_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(T3MINI_TEAM)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: t3 mini
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: 'Scan the pairing QR code shown in t3 mini on your computer, and take photos to send to the agent.'
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 'Dictate messages: turned into text on this iPhone, or by t3 mini on your computer if you choose it in Settings.'
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 'Dictate messages: your words are turned into text right on this iPhone.'
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 'Connect to t3 mini on your computer over the local network.'
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets: [T3MiniTests]

  # Opens the sealed title and project of a push notification on the phone (Shared/PushKey.swift).
  T3MiniNotify:
    type: app-extension
    platform: iOS
    sources: [T3MiniNotify, Shared]
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    entitlements:
      path: T3MiniNotify/T3MiniNotify.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(T3MINI_BUNDLE_ID).shared
    info:
      path: T3MiniNotify/Info.plist
      properties:
        CFBundleDisplayName: t3 mini
        T3MiniSharedKeychain: $(AppIdentifierPrefix)$(T3MINI_BUNDLE_ID).shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(T3MINI_BUNDLE_ID).notify
        DEVELOPMENT_TEAM: $(T3MINI_TEAM)
        TARGETED_DEVICE_FAMILY: '1,2'

  # Draws Live Activities: a thread at work on the lock screen and in the Dynamic Island
  # (LiveActivity/ThreadActivity.swift; updated by src/server/live-activities.ts).
  T3MiniWidgets:
    type: app-extension
    platform: iOS
    sources: [T3MiniWidgets, LiveActivity]
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    info:
      path: T3MiniWidgets/Info.plist
      properties:
        CFBundleDisplayName: t3 mini
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(T3MINI_BUNDLE_ID).widgets
        DEVELOPMENT_TEAM: $(T3MINI_TEAM)
        TARGETED_DEVICE_FAMILY: '1,2'

  T3MiniTests:
    type: bundle.unit-test
    platform: iOS
    sources: [T3MiniTests]
    dependencies:
      - target: T3Mini
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(T3MINI_BUNDLE_ID).tests
        DEVELOPMENT_TEAM: $(T3MINI_TEAM)
        GENERATE_INFOPLIST_FILE: YES
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
